services:
  mqtt:
    build: ../mosquitto
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ../mosquitto/data:/mosquitto/data
      - ../mosquitto/log:/mosquitto/log
      - ../mosquitto/config:/mosquitto/config

  db:
    build: ../mariadb
    container_name: mqtt-sql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: changeMeRoot
      MARIADB_DATABASE: telemetry
      MARIADB_USER: sensor
      MARIADB_PASSWORD: changeMeSensor
    ports:
      - "3306:3306"
    volumes:
      - ../mariadb/data:/var/lib/mysql
      - ../mariadb/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  subscriber:
    build: ../subscriber
    container_name: mqtt-subscriber
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_started
      db:
        condition: service_healthy

  web:
    build: ../web
    container_name: web-server
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # DHCP-Leases vom Host (für Geräte-Übersicht)
      - /var/lib/misc:/var/lib/misc:ro
    depends_on:
      db:
        condition: service_healthy

networks:
  default:
    name: iot-net