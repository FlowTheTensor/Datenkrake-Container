# =============================================================================
# Statische Host-Zuweisungen für bekannte Geräte
# Datei: /etc/dnsmasq.d/static-hosts.conf
# 
# Diese Datei wird von dnsmasq automatisch eingelesen.
# Nach Änderungen: sudo systemctl restart dnsmasq
# =============================================================================

# Format für statische IP-Zuweisung:
# dhcp-host=<MAC-Adresse>,<IP>,<Hostname>
#
# Die MAC-Adresse findest du:
# - Windows: ipconfig /all
# - Linux/Mac: ifconfig oder ip link
# - Auf dem Pi: cat /var/lib/misc/dnsmasq.leases

# =============================================================================
# ARDUINO / ESP GERÄTE (10.0.0.20 - 10.0.0.29)
# =============================================================================

# Beispiel Arduino mit Ethernet-Shield:
# dhcp-host=DE:AD:BE:EF:CA:FE,10.0.0.20,arduino-uno

# Beispiel ESP32:
# dhcp-host=AA:BB:CC:DD:EE:01,10.0.0.21,esp32-sensor

# Beispiel ESP8266:
# dhcp-host=AA:BB:CC:DD:EE:02,10.0.0.22,esp8266-node

# =============================================================================
# LEHRER-GERÄTE (10.0.0.30 - 10.0.0.39)
# =============================================================================

# Lehrer-Laptop:
# dhcp-host=11:22:33:44:55:66,10.0.0.30,laptop-lehrer

# =============================================================================
# SCHÜLER-GERÄTE (10.0.0.40 - 10.0.0.69)
# =============================================================================

# Gruppentische:
# dhcp-host=AA:11:BB:22:CC:33,10.0.0.40,tisch1
# dhcp-host=DD:44:EE:55:FF:66,10.0.0.41,tisch2
# dhcp-host=11:AA:22:BB:33:CC,10.0.0.42,tisch3

# =============================================================================
# SONSTIGE GERÄTE (10.0.0.70 - 10.0.0.99)
# =============================================================================

# Beamer:
# dhcp-host=BE:AM:ER:00:00:01,10.0.0.70,beamer

# Drucker:
# dhcp-host=PR:IN:TE:R0:00:01,10.0.0.71,drucker
