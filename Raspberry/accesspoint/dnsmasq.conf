# =============================================================================
# Datenkrake Access Point - dnsmasq Konfiguration
# DHCP-Server + lokaler DNS
# =============================================================================

# Interface auf dem DHCP läuft
interface=wlan0
bind-interfaces

# DHCP-Bereich: 10.0.0.10 bis 10.0.0.254, Lease-Zeit 24h
dhcp-range=10.0.0.10,10.0.0.254,24h

# Gateway (Raspberry Pi selbst)
dhcp-option=3,10.0.0.1

# DNS-Server (Raspberry Pi selbst für lokale Auflösung)
dhcp-option=6,10.0.0.1

# Lokale Domain
domain=datenkrake.local
expand-hosts

# DNS: Nur lokale Anfragen beantworten, kein upstream
no-resolv
no-poll

# Logging
log-queries
log-dhcp
log-facility=/var/log/dnsmasq.log

# =============================================================================
# Statische IP-Zuweisungen nach MAC-Adresse
# Format: dhcp-host=<MAC>,<IP>,<Hostname>,<Lease-Zeit>
# =============================================================================

# Raspberry Pi selbst (Gateway)
# IP: 10.0.0.1 (in dhcpcd.conf konfiguriert)

# Arduino/ESP-Geräte - Bereich 10.0.0.20-29
# Beispiel: dhcp-host=aa:bb:cc:dd:ee:ff,10.0.0.20,arduino-sensor1,infinite

# Computer/Laptops - Bereich 10.0.0.30-49
# Beispiel: dhcp-host=11:22:33:44:55:66,10.0.0.30,laptop-lehrer,infinite

# Smartphones/Tablets - Bereich 10.0.0.50-69
# Beispiel: dhcp-host=77:88:99:aa:bb:cc,10.0.0.50,tablet-schueler1,infinite

# =============================================================================
# Lokale DNS-Einträge
# =============================================================================
address=/datenkrake/10.0.0.1
address=/datenkrake.local/10.0.0.1
address=/pi.datenkrake.local/10.0.0.1
address=/dashboard.datenkrake.local/10.0.0.1

# Catch-all: Alle unbekannten Domains → Raspberry Pi (Captive Portal Effekt)
# Auskommentiert - nur aktivieren wenn gewünscht:
# address=/#/10.0.0.1
